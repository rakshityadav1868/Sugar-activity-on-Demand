<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Transactional repair state machine</title>
  <desc id="desc">State machine for preserving the original source, parsing and applying exact patches, verifying candidates, rolling back failures, committing progress, succeeding, or preserving a resumable draft.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#4b5563"/></marker>
    <style>
      .title{font:700 29px Inter,Arial,sans-serif;fill:#111827}.head{font:700 17px Inter,Arial,sans-serif;fill:#111827}.text{font:400 13px Inter,Arial,sans-serif;fill:#374151}.edge{stroke:#4b5563;stroke-width:2;fill:none;marker-end:url(#arrow)}.reject{stroke:#dc2626;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}.ok{stroke:#16a34a;stroke-width:3;fill:none;marker-end:url(#arrow)}.label{font:600 12px Inter,Arial,sans-serif;fill:#4b5563}
    </style>
  </defs>
  <rect width="1400" height="820" rx="24" fill="#f9fafb"/>
  <text x="55" y="54" class="title">Transactional repair — no second full generation</text>

  <rect x="65" y="120" width="245" height="105" rx="15" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <text x="90" y="153" class="head">Active source</text><text x="90" y="181" class="text">candidate N + diagnostics</text><text x="90" y="204" class="text">hash is the rollback anchor</text>
  <rect x="385" y="120" width="245" height="105" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="153" class="head">Request patch</text><text x="410" y="181" class="text">focused view or full source</text><text x="410" y="204" class="text">goal + bounded audit context</text>
  <rect x="705" y="120" width="245" height="105" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="730" y="153" class="head">Validate response</text><text x="730" y="181" class="text">patch blocks only · no secret</text><text x="730" y="204" class="text">unique anchors · not whole file</text>
  <rect x="1025" y="120" width="300" height="105" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1050" y="153" class="head">Atomic patch transaction</text><text x="1050" y="181" class="text">apply all blocks to a temporary candidate</text><text x="1050" y="204" class="text">zero partial mutation of active source</text>

  <path d="M310 172 H375" class="edge"/><path d="M630 172 H695" class="edge"/><path d="M950 172 H1015" class="edge"/>

  <rect x="1025" y="330" width="300" height="125" rx="15" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  <text x="1050" y="364" class="head">Verify complete candidate</text><text x="1050" y="392" class="text">known repairs → static request gate</text><text x="1050" y="416" class="text">runtime gate → lineage/goal checks</text><text x="1050" y="440" class="text">score remaining diagnostics</text>
  <path d="M1175 225 V320" class="edge"/>

  <rect x="695" y="345" width="250" height="100" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="378" class="head">All gates pass</text><text x="720" y="406" class="text">commit candidate</text><text x="720" y="429" class="text">return successful result</text>
  <path d="M1025 392 H955" class="ok"/><text x="966" y="379" class="label">pass</text>

  <rect x="375" y="345" width="250" height="100" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="378" class="head">Verified progress</text><text x="400" y="406" class="text">commit improved candidate</text><text x="400" y="429" class="text">continue with new diagnostics</text>
  <path d="M1025 420 C900 505 730 505 625 420" class="edge"/><text x="790" y="492" class="label">fewer/better diagnostics</text>
  <path d="M500 345 V280 C500 250 250 260 188 235" class="edge"/>

  <rect x="65" y="345" width="245" height="100" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="90" y="378" class="head">Reject + rollback</text><text x="90" y="406" class="text">active source unchanged</text><text x="90" y="429" class="text">record reason and hashes</text>
  <path d="M827 225 C760 285 370 285 310 370" class="reject"/><text x="500" y="273" class="label">malformed · ambiguous · full file · secret</text>
  <path d="M1025 445 C850 585 360 585 310 420" class="reject"/><text x="600" y="571" class="label">regression · cycle · no progress · gate failure</text>
  <path d="M188 345 V235" class="edge"/>

  <rect x="375" y="640" width="650" height="110" rx="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="405" y="675" class="head">Budget exhausted or provider unavailable</text>
  <text x="405" y="704" class="text">raise PipelineError with best complete draft, diagnostics, current plan, and bounded repair history</text>
  <text x="405" y="730" class="text">service persists resumable state; previous valid revision is never overwritten</text>
  <path d="M188 445 C188 620 360 615 450 640" class="reject"/><path d="M500 445 V630" class="reject"/>

  <rect x="65" y="775" width="1260" height="28" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="85" y="795" class="label">Every event records attempt, outcome, before/proposed/after hashes, patch count, diagnostics, and rolled_back status.</text>
</svg>
