<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">Sugar Activity Studio UI state machine</title><desc id="desc">States and transitions between Home, Create, guided clarification, Studio generation, success tabs, refinement, failure, cancellation, and reopening.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.t{font:700 29px Inter,Arial;fill:#0f172a}.s{font:400 14px Inter,Arial;fill:#475569}.h{font:700 17px Inter,Arial;fill:#0f172a}.b{font:400 13px Inter,Arial;fill:#334155}.l{font:600 12px Inter,Arial;fill:#475569}.e{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#a)}.d{stroke:#7c3aed;stroke-width:2.2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="850" rx="24" fill="#f8fafc"/><text x="55" y="55" class="t">CreateAIActivityPanel — active UI state machine</text><text x="55" y="82" class="s">Solid arrows are normal navigation; dashed arrows restore or reset state.</text>
  <g transform="translate(65 150)"><rect width="220" height="130" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="22" y="36" class="h">HOME</text><text x="22" y="65" class="b">generated-project ring</text><text x="22" y="88" class="b">New / Open / Modify</text><text x="22" y="112" class="l">top stack: home</text></g>
  <g transform="translate(365 150)"><rect width="250" height="130" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="22" y="36" class="h">CREATE</text><text x="22" y="65" class="b">prompt · areas · provider</text><text x="22" y="88" class="b">license · size · reference</text><text x="22" y="112" class="l">top stack: create</text></g>
  <g transform="translate(695 125)"><rect width="270" height="180" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="22" y="36" class="h">GUIDED CLARIFICATION</text><text x="22" y="66" class="b">optional short-prompt enhance</text><text x="22" y="89" class="b">typed questions + Other</text><text x="22" y="112" class="b">confirmed requirements</text><line x1="22" y1="128" x2="248" y2="128" stroke="#f59e0b"/><text x="22" y="151" class="l">No active plan-approval screen</text><text x="22" y="170" class="l">tabs/tools locked</text></g>
  <g transform="translate(1045 125)"><rect width="320" height="180" rx="18" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/><text x="22" y="36" class="h">STUDIO · BUILDING</text><text x="22" y="66" class="b">persistent job + session</text><text x="22" y="89" class="b">progress / draft / diagnostics</text><text x="22" y="112" class="b">chat and tools disabled</text><line x1="22" y1="128" x2="298" y2="128" stroke="#d946ef"/><text x="22" y="151" class="l">Preview animation</text><text x="22" y="170" class="l">Review may show unaccepted draft</text></g>
  <path d="M285 215H365M615 215H695M965 215H1045" class="e"/><text x="302" y="199" class="l">New</text><text x="625" y="199" class="l">Send / remote</text><text x="977" y="199" class="l">Confirm</text>
  <path d="M615 255C785 345 980 330 1110 305" class="e"/><text x="720" y="340" class="l">local-template: skip guided</text>
  <g transform="translate(430 455)"><rect width="585" height="245" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="24" y="39" class="h">STUDIO · READY — accepted GenerationResult + active revision</text><rect x="24" y="66" width="160" height="70" rx="12" fill="#fff" stroke="#16a34a"/><text x="68" y="97" class="h">Preview</text><text x="46" y="119" class="l">play / select / ask</text><rect x="208" y="66" width="160" height="70" rx="12" fill="#fff" stroke="#16a34a"/><text x="259" y="97" class="h">Review</text><text x="229" y="119" class="l">accepted files</text><rect x="392" y="66" width="160" height="70" rx="12" fill="#fff" stroke="#16a34a"/><text x="433" y="97" class="h">Versions</text><text x="415" y="119" class="l">source / diff</text><text x="24" y="175" class="b">chat refinement · Activity Tools · rebuild · export · install</text><text x="24" y="204" class="l">tab changes remain inside this state</text><text x="24" y="226" class="l">drawer is an overlay sub-state: closed / home / change / understand</text></g>
  <path d="M1205 305C1205 405 1015 407 955 455" class="e"/><text x="1098" y="389" class="l">success / apply result</text>
  <g transform="translate(1090 480)"><rect width="275" height="145" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="22" y="36" class="h">FAILED / CANCELLED</text><text x="22" y="66" class="b">preserve draft + diagnostics</text><text x="22" y="89" class="b">accepted parent stays active</text><text x="22" y="118" class="l">retry or continue repair where valid</text></g>
  <path d="M1300 305V480" class="e"/><text x="1310" y="404" class="l">terminal error</text>
  <path d="M1015 580H1090" class="e"/><text x="1024" y="564" class="l">refine fails</text>
  <path d="M690 455C690 395 880 380 1045 270" class="e"/><text x="744" y="403" class="l">refine / rebuild → child job</text>
  <path d="M430 650C300 730 175 650 175 280" class="d"/><text x="195" y="720" class="l">Back/reset: cancel, dispose, clear IDs/image, refresh Home</text>
  <path d="M285 250C350 360 420 400 520 455" class="d"/><text x="278" y="369" class="l">Open project → restore session/revision</text>
  <rect x="65" y="770" width="1300" height="45" rx="11" fill="#fff" stroke="#cbd5e1"/><text x="87" y="798" class="b">GTK rule: provider/question/job work runs off-thread; every widget mutation returns through GObject.idle_add on the GTK main loop.</text>
</svg>
