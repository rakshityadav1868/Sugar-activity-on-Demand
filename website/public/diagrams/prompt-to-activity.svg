<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Detailed prompt-to-activity flow</title><desc id="desc">Composer inputs, reference privacy handling, clarification branch, ActivitySpec mapping, persistent service job, generation gates, accepted project, revision, and Studio result.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.t{font:700 29px Inter,Arial;fill:#0f172a}.s{font:400 14px Inter,Arial;fill:#475569}.h{font:700 16px Inter,Arial;fill:#0f172a}.b{font:400 12.5px Inter,Arial;fill:#334155}.l{font:600 11.5px Inter,Arial;fill:#475569}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.d{stroke:#7c3aed;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="980" rx="24" fill="#f8fafc"/><text x="52" y="52" class="t">Prompt → accepted Sugar activity</text><text x="52" y="79" class="s">Field mapping, async boundaries, trust gates, persistence, and refinement convergence.</text>
  <g transform="translate(52 120)"><rect width="260" height="210" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="20" y="34" class="h">1 · CREATE COMPOSER</text><text x="20" y="66" class="b">idea text</text><text x="20" y="89" class="b">learning areas + age</text><text x="20" y="112" class="b">collaboration + code size</text><text x="20" y="135" class="b">provider + policy + enhance</text><text x="20" y="158" class="b">SPDX license</text><text x="20" y="181" class="b">optional PNG/JPEG</text><text x="20" y="202" class="l">__send_button_clicked_cb</text></g>
  <g transform="translate(372 120)"><rect width="260" height="210" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="20" y="34" class="h">2 · REFERENCE BRANCH</text><text x="20" y="66" class="b">normalize pixels in memory</text><text x="20" y="89" class="b">vision analysis if capable</text><text x="20" y="112" class="b">append short layout brief</text><line x1="20" y1="130" x2="240" y2="130" stroke="#f59e0b"/><text x="20" y="153" class="l">pixels never persisted</text><text x="20" y="176" class="l">failure does not block build</text><text x="20" y="199" class="l">image may go direct to provider</text></g>
  <g transform="translate(692 120)"><rect width="300" height="210" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="20" y="34" class="h">3 · CLARIFY (REMOTE)</text><text x="20" y="66" class="b">optional short-prompt enhancement</text><text x="20" y="89" class="b">generate typed questions off-thread</text><text x="20" y="112" class="b">collect single/multi/text answers</text><text x="20" y="135" class="b">build confirmed requirements</text><line x1="20" y1="153" x2="280" y2="153" stroke="#f59e0b"/><text x="20" y="178" class="l">local mode bypasses this box</text><text x="20" y="199" class="l">no separate UI plan approval</text></g>
  <g transform="translate(1052 120)"><rect width="390" height="210" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="20" y="34" class="h">4 · ActivitySpec</text><text x="20" y="66" class="b">name ← learner idea via name_from_prompt</text><text x="20" y="89" class="b">prompt ← confirmed request + collaboration prefix</text><text x="20" y="112" class="b">category/categories ← selected learning areas</text><text x="20" y="135" class="b">license_id · code_size · age_band</text><line x1="20" y1="153" x2="370" y2="153" stroke="#8b5cf6"/><text x="20" y="178" class="l">normalized + validated provider-independent intent</text><text x="20" y="199" class="l">core/spec.py</text></g>
  <path d="M312 225H372M632 225H692M992 225H1052" class="e"/><path d="M312 300C530 385 820 382 1085 330" class="d"/><text x="548" y="373" class="l">local-template direct path</text>
  <g transform="translate(52 430)"><rect width="300" height="180" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="20" y="34" class="h">5 · UI SUBMISSION</text><text x="20" y="64" class="b">resolve provider and policy</text><text x="20" y="87" class="b">reject second active job</text><text x="20" y="110" class="b">validation always enabled</text><text x="20" y="133" class="b">switch Studio to building</text><text x="20" y="158" class="l">_submit_generation_spec</text></g>
  <g transform="translate(412 430)"><rect width="300" height="180" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="20" y="34" class="h">6 · LOCAL SERVICE</text><text x="20" y="64" class="b">create job + session first</text><text x="20" y="87" class="b">enqueue worker task</text><text x="20" y="110" class="b">persist progress atomically</text><text x="20" y="133" class="b">watch / cancel / recover</text><text x="20" y="158" class="l">service/service.py + queue.py</text></g>
  <g transform="translate(772 400)"><rect width="390" height="240" rx="16" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/><text x="20" y="34" class="h">7 · GENERATION POLICY</text><text x="20" y="64" class="b">enhance → retrieve examples → structured plan</text><text x="20" y="87" class="b">one complete code candidate</text><text x="20" y="110" class="b">known fixes → static request-aware gate</text><text x="20" y="133" class="b">runtime verification where infrastructure exists</text><text x="20" y="156" class="b">bounded transactional patch repair → critic</text><text x="20" y="179" class="b">icon + project files + bundle metadata</text><line x1="20" y1="195" x2="370" y2="195" stroke="#d946ef"/><text x="20" y="220" class="l">candidate source is untrusted inside this box</text></g>
  <g transform="translate(1222 430)"><rect width="220" height="180" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="20" y="34" class="h">REJECTED</text><text x="20" y="64" class="b">persist draft</text><text x="20" y="87" class="b">diagnostics + repair audit</text><text x="20" y="110" class="b">do not activate revision</text><text x="20" y="139" class="l">parent stays accepted</text></g>
  <path d="M1240 330C1240 380 202 370 202 430" class="e"/><path d="M352 520H412M712 520H772" class="e"/><path d="M1162 520H1222" class="e"/><text x="1172" y="503" class="l">gate fails</text>
  <g transform="translate(442 735)"><rect width="360" height="160" rx="17" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="20" y="34" class="h">8 · ACCEPTED ARTIFACTS</text><text x="20" y="64" class="b">projects/&lt;Name&gt;.activity/</text><text x="20" y="87" class="b">activity.py · plan · metadata · icon · license</text><text x="20" y="110" class="b">session revision with parent + result summary</text><text x="20" y="137" class="l">active revision changes only after success</text></g>
  <g transform="translate(882 735)"><rect width="360" height="160" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="20" y="34" class="h">9 · STUDIO READY</text><text x="20" y="64" class="b">render Preview · refresh Review + Versions</text><text x="20" y="87" class="b">enable chat + derive tool suggestions</text><text x="20" y="110" class="b">refine / rebuild / export / install</text><text x="20" y="137" class="l">_apply_generation_result</text></g>
  <path d="M967 640C967 690 802 690 730 735" class="e"/><text x="840" y="686" class="l">all acceptance gates pass</text><path d="M802 815H882" class="e"/><path d="M1062 735C1062 680 562 680 562 610" class="d"/><text x="698" y="673" class="l">chat / selection / Activity Tools → focused child refinement</text>
  <rect x="52" y="925" width="1390" height="34" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="72" y="947" class="b">Async boundary: workers publish job state; panel watcher callbacks return to GTK main loop before changing Studio widgets.</text>
</svg>
