<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" role="img" aria-labelledby="title desc">
  <title id="title">Sugar Activity Studio workspace layout</title><desc id="desc">Annotated layout with left conversation pane, central tabbed workspace and ask bar, footer actions, and right overlay Activity Tools drawer.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.t{font:700 29px Inter,Arial;fill:#0f172a}.s{font:400 14px Inter,Arial;fill:#475569}.h{font:700 16px Inter,Arial;fill:#0f172a}.b{font:400 13px Inter,Arial;fill:#334155}.l{font:600 12px Inter,Arial;fill:#475569}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1480" height="900" rx="24" fill="#f8fafc"/><text x="52" y="53" class="t">Studio workspace — layout and responsibility</text><text x="52" y="80" class="s">The right-hand tools are a revealable overlay above the workspace, not another pane that permanently shrinks Preview.</text>
  <rect x="50" y="115" width="1380" height="650" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <rect x="50" y="115" width="400" height="590" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="76" y="151" class="h">LEFT · CONVERSATION</text><text x="76" y="180" class="b">user requests and reference thumbnail</text><text x="76" y="204" class="b">provider/license/status messages</text><text x="76" y="228" class="b">generation and repair progress</text><text x="76" y="252" class="b">assistant completion messages</text><text x="76" y="276" class="b">editable refinement suggestions</text>
  <rect x="76" y="315" width="348" height="280" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="103" cy="349" r="15" fill="#7c3aed"/><rect x="127" y="336" width="230" height="26" rx="9" fill="#ede9fe"/><circle cx="103" cy="401" r="15" fill="#0284c7"/><rect x="127" y="386" width="270" height="31" rx="9" fill="#e0f2fe"/><rect x="127" y="431" width="218" height="18" rx="7" fill="#e2e8f0"/><rect x="127" y="465" width="250" height="18" rx="7" fill="#e2e8f0"/><rect x="127" y="512" width="128" height="35" rx="17" fill="#dcfce7"/><rect x="266" y="512" width="128" height="35" rx="17" fill="#dcfce7"/>
  <rect x="76" y="622" width="348" height="55" rx="15" fill="#fff" stroke="#94a3b8"/><text x="96" y="655" class="b">Ask for a refinement…</text><circle cx="392" cy="649" r="18" fill="#f26440"/>
  <line x1="450" y1="115" x2="450" y2="705" stroke="#64748b" stroke-width="4"/><text x="458" y="690" class="l">Gtk.Paned divider · initial position ≈ 455 px</text>
  <rect x="450" y="115" width="980" height="590" rx="18" fill="#eff6ff" stroke="#0284c7" stroke-width="2"/><rect x="450" y="115" width="980" height="58" rx="18" fill="#dbeafe"/><text x="478" y="151" class="h">Preview</text><text x="568" y="151" class="h">Review</text><text x="653" y="151" class="h">Versions</text><rect x="1004" y="128" width="96" height="32" rx="14" fill="#fff"/><text x="1024" y="149" class="l">Fullscreen</text><rect x="1110" y="128" width="104" height="32" rx="14" fill="#fff"/><text x="1129" y="149" class="l">Edit / Play</text><rect x="1224" y="128" width="178" height="32" rx="14" fill="#7c3aed"/><text x="1244" y="149" style="font:700 12px Inter,Arial;fill:#fff">🔧 Change / Tools</text>
  <rect x="478" y="194" width="924" height="395" rx="14" fill="#fff" stroke="#93c5fd"/><text x="790" y="235" class="h">ACTIVE TAB CONTENT</text><text x="740" y="264" class="b">Preview: embedded activity + selection overlay</text><text x="740" y="287" class="b">Review: file tree + source/diagnostics</text><text x="740" y="310" class="b">Versions: revision cards + source/diff</text><rect x="610" y="345" width="650" height="180" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="8 6"/><text x="836" y="435" class="l">generated activity canvas</text>
  <rect x="585" y="611" width="710" height="58" rx="22" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="600" y="623" width="50" height="34" rx="14" fill="#ede9fe"/><text x="611" y="645" class="l">Edit</text><rect x="656" y="623" width="50" height="34" rx="14" fill="#f1f5f9"/><text x="668" y="645" class="l">Play</text><text x="727" y="645" class="b">+ activity canvas   Describe a change…</text><circle cx="1266" cy="640" r="18" fill="#f26440"/>
  <rect x="1010" y="173" width="392" height="496" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="1034" y="207" class="h">🔧 ACTIVITY TOOLS · OVERLAY</text><text x="1034" y="232" class="l">Gtk.Revealer · SLIDE_LEFT · top margin 50</text><rect x="1034" y="260" width="344" height="94" rx="13" fill="#fff" stroke="#f59e0b"/><text x="1054" y="290" class="h">Change this activity</text><text x="1054" y="316" class="b">preset/custom → target → review → Apply</text><text x="1054" y="338" class="l">nothing changes before confirmation</text><rect x="1034" y="372" width="344" height="128" rx="13" fill="#fff" stroke="#f59e0b"/><text x="1054" y="402" class="h">Understand and reflect</text><text x="1054" y="428" class="b">goal · explanation · Try/Notice/Explain/Imagine</text><text x="1054" y="452" class="b">important code links · health · saved notes</text><text x="1054" y="478" class="l">observation can become a reviewed change</text><text x="1034" y="548" class="b">Drawer overlays the canvas region while open.</text><text x="1034" y="572" class="b">Header tabs remain visible above it.</text><text x="1034" y="603" class="l">disabled while no accepted result or job active</text>
  <rect x="50" y="705" width="1380" height="60" rx="0" fill="#e2e8f0"/><text x="76" y="741" class="h">Back</text><rect x="735" y="719" width="110" height="34" rx="12" fill="#fff"/><text x="759" y="741" class="l">Rebuild</text><rect x="858" y="719" width="120" height="34" rx="12" fill="#fff"/><text x="882" y="741" class="l">Export XO</text><rect x="991" y="719" width="140" height="34" rx="12" fill="#fff"/><text x="1012" y="741" class="l">Export Flatpak</text><rect x="1144" y="719" width="258" height="34" rx="12" fill="#16a34a"/><text x="1221" y="741" style="font:700 12px Inter,Arial;fill:#fff">Install &amp; Open</text>
  <path d="M1240 795V765" class="e"/><text x="1080" y="823" class="b">Footer actions always use the accepted project—not Review's live draft.</text>
  <rect x="50" y="850" width="1380" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="70" y="870" class="l">Ownership: layout/navigation in ui/panel.py · visual rules in ui/theme.py · no generation policy inside these widgets.</text>
</svg>
