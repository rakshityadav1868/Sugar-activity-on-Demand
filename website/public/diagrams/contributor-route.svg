<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">New contributor route through Sugar Activity Studio</title>
  <desc id="desc">A left-to-right walkthrough from host startup and creation through the service, generation gates, Studio tools, refinement, and persistent revisions.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.t{font:700 29px Inter,Arial;fill:#0f172a}.s{font:400 14px Inter,Arial;fill:#475569}.h{font:700 17px Inter,Arial;fill:#0f172a}.b{font:400 13px Inter,Arial;fill:#334155}.n{font:700 14px Inter,Arial;fill:#fff}.e{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="620" rx="24" fill="#f8fafc"/>
  <text x="55" y="54" class="t">Contributor route: experience the product, then follow ownership</text>
  <text x="55" y="81" class="s">Each visible step maps to one architectural owner. Read downward only when debugging that boundary.</text>
  <path d="M223 190H277M493 190H547M763 190H817M1033 190H1087M1235 245V316M1087 410H1033M817 410H763M547 410H493" class="e"/>
  <g transform="translate(55 125)"><rect width="168" height="130" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#7c3aed"/><text x="24" y="33" class="n">1</text><text x="20" y="70" class="h">Launch host</text><text x="20" y="94" class="b">main.py or activity.py</text><text x="20" y="116" class="b">creates shared panel</text></g>
  <g transform="translate(277 125)"><rect width="216" height="130" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#0284c7"/><text x="24" y="33" class="n">2</text><text x="20" y="70" class="h">Create intent</text><text x="20" y="94" class="b">prompt · options · image</text><text x="20" y="116" class="b">ui/panel.py → ActivitySpec</text></g>
  <g transform="translate(547 125)"><rect width="216" height="130" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#16a34a"/><text x="24" y="33" class="n">3</text><text x="20" y="70" class="h">Submit durable job</text><text x="20" y="94" class="b">service + worker queue</text><text x="20" y="116" class="b">watch · cancel · persist</text></g>
  <g transform="translate(817 125)"><rect width="216" height="130" rx="16" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#a21caf"/><text x="24" y="33" class="n">4</text><text x="20" y="70" class="h">Build and verify</text><text x="20" y="94" class="b">plan → code → gates</text><text x="20" y="116" class="b">repair → project</text></g>
  <g transform="translate(1087 125)"><rect width="298" height="130" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#d97706"/><text x="24" y="33" class="n">5</text><text x="20" y="70" class="h">Adopt accepted result</text><text x="20" y="94" class="b">project directory + session revision</text><text x="20" y="116" class="b">candidate becomes active only here</text></g>
  <g transform="translate(1087 345)"><rect width="298" height="130" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#0284c7"/><text x="24" y="33" class="n">6</text><text x="20" y="70" class="h">Use Studio</text><text x="20" y="94" class="b">Preview · Review · Versions</text><text x="20" y="116" class="b">Activity Tools · exports</text></g>
  <g transform="translate(817 345)"><rect width="216" height="130" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#16a34a"/><text x="24" y="33" class="n">7</text><text x="20" y="70" class="h">Request delta</text><text x="20" y="94" class="b">chat, selection, or tool</text><text x="20" y="116" class="b">focused refinement spec</text></g>
  <g transform="translate(547 345)"><rect width="216" height="130" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#64748b"/><text x="24" y="33" class="n">8</text><text x="20" y="70" class="h">Create child revision</text><text x="20" y="94" class="b">parent remains immutable</text><text x="20" y="116" class="b">failure keeps active parent</text></g>
  <g transform="translate(55 530)"><rect width="1330" height="52" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="22" y="32" class="b">Debugging rule: begin at the visible action → follow its callback → inspect the service record → enter the pipeline only for the stage that owns the failure.</text></g>
</svg>
