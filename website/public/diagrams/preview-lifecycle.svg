<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Preview and live edit lifecycle</title><desc id="desc">Accepted result enters compatibility runner, returns GTK widgets, is embedded with event routing, supports text-targeted refinements, and is disposed on replacement or reset.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.t{font:700 29px Inter,Arial;fill:#0f172a}.s{font:400 14px Inter,Arial;fill:#475569}.h{font:700 16px Inter,Arial;fill:#0f172a}.b{font:400 12.5px Inter,Arial;fill:#334155}.l{font:600 11.5px Inter,Arial;fill:#475569}.e{stroke:#475569;stroke-width:2.1;fill:none;marker-end:url(#a)}.d{stroke:#7c3aed;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="760" rx="24" fill="#f8fafc"/><text x="52" y="53" class="t">Accepted result → embedded preview → focused refinement</text><text x="52" y="80" class="s">Preview executes accepted project code in a compatibility host; selection modifies only the next request, never the files directly.</text>
  <g transform="translate(50 130)"><rect width="220" height="150" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="20" y="34" class="h">ACCEPTED RESULT</text><text x="20" y="65" class="b">project_path</text><text x="20" y="88" class="b">spec.name</text><text x="20" y="111" class="b">validated activity.py</text><text x="20" y="136" class="l">_show_generated…</text></g>
  <g transform="translate(330 110)"><rect width="260" height="190" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="20" y="34" class="h">PREVIEW RUNNER</text><text x="20" y="64" class="b">load with compatibility host</text><text x="20" y="87" class="b">patch only preview-time assumptions</text><text x="20" y="110" class="b">capture instance + canvas + toolbar</text><text x="20" y="133" class="b">track GLib/GTK resources</text><text x="20" y="163" class="l">preview/runner.py</text></g>
  <g transform="translate(650 110)"><rect width="300" height="190" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="20" y="34" class="h">EMBED IN EVENT SHELL</text><text x="20" y="64" class="b">clear prior preview first</text><text x="20" y="87" class="b">reparent toolbar + canvas</text><text x="20" y="110" class="b">focus canvas + forward keys</text><text x="20" y="133" class="b">attach edit handlers after show</text><text x="20" y="163" class="l">ui/panel.py</text></g>
  <g transform="translate(1010 110)"><rect width="380" height="190" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="20" y="34" class="h">INTERACTION ROUTING</text><rect x="20" y="55" width="158" height="78" rx="11" fill="#fff" stroke="#f59e0b"/><text x="37" y="82" class="h">PLAY</text><text x="37" y="107" class="b">events reach activity</text><text x="37" y="124" class="l">shell below child</text><rect x="194" y="55" width="166" height="78" rx="11" fill="#fff" stroke="#f59e0b"/><text x="211" y="82" class="h">EDIT</text><text x="211" y="107" class="b">shell selects target</text><text x="211" y="124" class="l">shell above child</text><text x="20" y="162" class="b">click widget · click/drag canvas zone</text></g>
  <path d="M270 205H330M590 205H650M950 205H1010" class="e"/>
  <g transform="translate(820 415)"><rect width="330" height="170" rx="16" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/><text x="20" y="34" class="h">TEXTUAL TARGET CONTEXT</text><text x="20" y="64" class="b">describe widget or canvas geometry</text><text x="20" y="87" class="b">target + user change</text><text x="20" y="110" class="b">“keep the rest unchanged”</text><text x="20" y="139" class="l">→ _submit_refinement_from_prompt</text></g>
  <path d="M1200 300C1200 380 1100 375 1060 415" class="e"/>
  <g transform="translate(1190 415)"><rect width="200" height="170" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="20" y="34" class="h">RENDER ERROR</text><text x="20" y="64" class="b">accepted files remain</text><text x="20" y="87" class="b">show amber recovery UI</text><text x="20" y="110" class="b">Review or refine</text><text x="20" y="139" class="l">not generation failure</text></g>
  <path d="M470 300C470 385 1185 335 1260 415" class="d"/><text x="720" y="354" class="l">runner cannot provide a canvas</text>
  <g transform="translate(50 410)"><rect width="320" height="190" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="20" y="34" class="h">CLEANUP CONTRACT</text><text x="20" y="64" class="b">detach selection handlers</text><text x="20" y="87" class="b">remove shell/canvas/toolbar</text><text x="20" y="110" class="b">dispose activity + GLib sources</text><text x="20" y="133" class="b">clear animations and references</text><text x="20" y="163" class="l">_clear_activity_preview</text></g>
  <path d="M750 300C750 350 300 350 250 410" class="e"/><text x="410" y="344" class="l">replace result · Home · host close</text><path d="M820 500C680 500 660 205 590 205" class="d"/><text x="545" y="487" class="l">successful child result re-enters render lifecycle</text>
  <rect x="50" y="670" width="1340" height="52" rx="11" fill="#fff" stroke="#cbd5e1"/><text x="70" y="692" class="b">Resource invariant: every signal, timer, instance, and widget reference acquired for a preview must have a deterministic release path.</text><text x="70" y="711" class="l">Test render → refine → render and render → reset; these expose duplicated timers and callbacks into destroyed widgets.</text>
</svg>
