<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900" role="img" aria-labelledby="title desc">
  <title id="title">Security trust boundaries</title>
  <desc id="desc">Trust-zone diagram showing learner input, remote provider responses, validation gates, isolated runtime execution, accepted project storage, in-process preview, export, and secrets that never cross into generated artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#4b5563"/></marker>
    <style>
      .title{font:700 29px Inter,Arial,sans-serif;fill:#111827}.zone{font:700 15px Inter,Arial,sans-serif;fill:#374151;letter-spacing:.08em}.head{font:700 17px Inter,Arial,sans-serif;fill:#111827}.text{font:400 13px Inter,Arial,sans-serif;fill:#374151}.small{font:400 12px Inter,Arial,sans-serif;fill:#4b5563}.edge{stroke:#4b5563;stroke-width:2;fill:none;marker-end:url(#arrow)}.forbid{stroke:#dc2626;stroke-width:3;stroke-dasharray:8 6;fill:none}.boundary{fill:none;stroke:#dc2626;stroke-width:2;stroke-dasharray:10 7}
    </style>
  </defs>
  <rect width="1450" height="900" rx="24" fill="#f9fafb"/>
  <text x="55" y="54" class="title">Trust boundaries and defense-in-depth</text>

  <rect x="45" y="90" width="360" height="730" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="70" y="125" class="zone">UNTRUSTED INPUT</text>
  <rect x="75" y="165" width="300" height="105" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="100" y="198" class="head">Learner request</text><text x="100" y="226" class="text">text · options · filenames</text><text x="100" y="249" class="small">validate type, length, enum, path use</text>
  <rect x="75" y="310" width="300" height="120" rx="14" fill="#fee2e2" stroke="#dc2626"/>
  <text x="100" y="343" class="head">Reference image</text><text x="100" y="371" class="text">PNG/JPEG decoder input</text><text x="100" y="395" class="text">size, dimension, pixel limits</text><text x="100" y="418" class="small">resize + strip metadata · memory only</text>
  <rect x="75" y="470" width="300" height="145" rx="14" fill="#fee2e2" stroke="#dc2626"/>
  <text x="100" y="503" class="head">Provider response</text><text x="100" y="531" class="text">JSON plan · Python · patches · SVG</text><text x="100" y="555" class="text">may be malformed, unsafe, or truncated</text><text x="100" y="579" class="text">may echo credential material</text><text x="100" y="602" class="small">never trusted by response format alone</text>
  <rect x="75" y="655" width="300" height="115" rx="14" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="100" y="688" class="head">Host project paths</text><text x="100" y="716" class="text">existing activity corpus · export target</text><text x="100" y="740" class="small">validate identifiers and explicit roots</text>

  <rect x="450" y="90" width="530" height="730" rx="22" fill="#faf5ff" stroke="#a21caf" stroke-width="2"/>
  <text x="475" y="125" class="zone">VALIDATION AND CONTAINMENT</text>
  <rect x="485" y="165" width="460" height="115" rx="14" fill="#ede9fe" stroke="#7e22ce"/>
  <text x="510" y="198" class="head">Input and plan normalization</text><text x="510" y="226" class="text">ActivitySpec validation · allowlisted plan schema</text><text x="510" y="250" class="small">safe fallbacks for soft steering fields</text>
  <rect x="485" y="320" width="460" height="145" rx="14" fill="#fae8ff" stroke="#a21caf"/>
  <text x="510" y="353" class="head">Static source gate</text><text x="510" y="381" class="text">AST syntax/shape · import and call allowlists</text><text x="510" y="405" class="text">blocked network/process/filesystem behavior</text><text x="510" y="429" class="text">request alignment · project/manifest/bundle checks</text><text x="510" y="452" class="small">errors reject; warnings become guided feedback</text>
  <rect x="485" y="505" width="460" height="145" rx="14" fill="#fee2e2" stroke="#dc2626"/>
  <text x="510" y="538" class="head">Isolated runtime gate</text><text x="510" y="566" class="text">independent infrastructure probe</text><text x="510" y="590" class="text">temporary project · minimal environment subprocess</text><text x="510" y="614" class="text">start · draw/events · delayed state · Journal round trip</text><text x="510" y="637" class="small">timeout/crash → repair; unavailable host → unverified skip</text>
  <rect x="485" y="690" width="460" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="510" y="723" class="head">Sanitizers and transaction rules</text><text x="510" y="751" class="text">SVG allowlist · secret redaction · atomic exact patches</text><text x="510" y="773" class="small">whole-file replacement, ambiguity, and cycles refused</text>

  <rect x="1025" y="90" width="380" height="730" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1050" y="125" class="zone">ACCEPTED LOCAL STATE</text>
  <rect x="1060" y="165" width="310" height="125" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1085" y="198" class="head">Generated project</text><text x="1085" y="226" class="text">verified source · sanitized icon</text><text x="1085" y="250" class="text">plan provenance · hashes · audit</text><text x="1085" y="275" class="small">still limited to the generated contract</text>
  <rect x="1060" y="330" width="310" height="125" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="1085" y="363" class="head">Interactive preview</text><text x="1085" y="391" class="text">accepted source runs in-process</text><text x="1085" y="415" class="text">compatibility host + cleanup</text><text x="1085" y="440" class="small">not an arbitrary Python sandbox</text>
  <rect x="1060" y="495" width="310" height="125" rx="14" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="1085" y="528" class="head">Persistence</text><text x="1085" y="556" class="text">atomic JSON records · bounded job audit</text><text x="1085" y="580" class="text">owner-private provider settings</text><text x="1085" y="605" class="small">malformed records skipped safely</text>
  <rect x="1060" y="660" width="310" height="120" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="1085" y="693" class="head">XO / Flatpak export</text><text x="1085" y="721" class="text">validated IDs · explicit staging</text><text x="1085" y="745" class="text">review runtime permissions before release</text><text x="1085" y="768" class="small">distribution is a separate trust decision</text>

  <path d="M375 215 H475" class="edge"/><path d="M375 370 C430 370 430 220 475 220" class="edge"/><path d="M375 540 H475" class="edge"/><path d="M375 710 C430 710 430 735 475 735" class="edge"/>
  <path d="M945 225 H1050" class="edge"/><path d="M945 390 C1000 390 1000 225 1050 225" class="edge"/><path d="M945 575 C1010 575 990 392 1050 392" class="edge"/><path d="M945 735 H1050" class="edge"/>

  <rect x="250" y="835" width="950" height="43" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="275" y="862" class="head">API keys and reference pixels must never enter generated source, plans, jobs, sessions, logs, or exports.</text>
  <path d="M435 831 L455 881 M455 831 L435 881" stroke="#dc2626" stroke-width="4"/>
</svg>
