<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img" aria-labelledby="title desc">
  <title id="title">Initial generation sequence</title>
  <desc id="desc">Sequence diagram showing the UI, service, queue worker, generation pipeline, model provider, verification gates, and disk during an initial activity generation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#374151"/></marker>
    <style>
      .title { font: 700 28px Inter,Arial,sans-serif; fill:#111827 }
      .head { font: 700 15px Inter,Arial,sans-serif; fill:#111827 }
      .label { font: 500 13px Inter,Arial,sans-serif; fill:#1f2937 }
      .note { font: 400 12px Inter,Arial,sans-serif; fill:#4b5563 }
      .life { stroke:#9ca3af; stroke-width:2; stroke-dasharray:6 6 }
      .call { stroke:#374151; stroke-width:2; fill:none; marker-end:url(#arrow) }
      .return { stroke:#6b7280; stroke-width:2; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow) }
    </style>
  </defs>
  <rect width="1500" height="1030" rx="24" fill="#f9fafb"/>
  <text x="55" y="52" class="title">Initial activity generation — request and verification sequence</text>

  <g>
    <rect x="50" y="85" width="150" height="52" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="125" y="116" text-anchor="middle" class="head">GTK UI</text>
    <rect x="255" y="85" width="160" height="52" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="335" y="116" text-anchor="middle" class="head">AODService</text>
    <rect x="470" y="85" width="160" height="52" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="550" y="116" text-anchor="middle" class="head">Queue worker</text>
    <rect x="685" y="85" width="170" height="52" rx="10" fill="#fae8ff" stroke="#a21caf"/><text x="770" y="116" text-anchor="middle" class="head">Pipeline</text>
    <rect x="910" y="85" width="160" height="52" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="990" y="116" text-anchor="middle" class="head">Provider</text>
    <rect x="1125" y="85" width="160" height="52" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="1205" y="116" text-anchor="middle" class="head">Gates</text>
    <rect x="1340" y="85" width="110" height="52" rx="10" fill="#f3f4f6" stroke="#6b7280"/><text x="1395" y="116" text-anchor="middle" class="head">Disk</text>
  </g>
  <g>
    <line x1="125" y1="137" x2="125" y2="980" class="life"/><line x1="335" y1="137" x2="335" y2="980" class="life"/><line x1="550" y1="137" x2="550" y2="980" class="life"/><line x1="770" y1="137" x2="770" y2="980" class="life"/><line x1="990" y1="137" x2="990" y2="980" class="life"/><line x1="1205" y1="137" x2="1205" y2="980" class="life"/><line x1="1395" y1="137" x2="1395" y2="980" class="life"/>
  </g>

  <text x="145" y="178" class="label">1  submit ActivitySpec + options</text><path d="M125 188 H325" class="call"/>
  <text x="355" y="218" class="label">validate + normalize; ensure session</text><path d="M335 228 H1385" class="call"/>
  <text x="920" y="249" class="note">Persist user message, queued job, and privacy-safe metadata.</text>
  <text x="355" y="285" class="label">2  enqueue persistent job</text><path d="M335 295 H540" class="call"/>
  <text x="570" y="332" class="label">3  resolve provider and start pipeline</text><path d="M550 342 H760" class="call"/>

  <rect x="700" y="370" width="610" height="114" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="720" y="397" class="head">Enhance, ground, and plan</text>
  <text x="720" y="424" class="label">short prompt → enhance (unless confirmed/agreed)</text>
  <text x="720" y="448" class="label">local RAG corpus → ranked Sugar references</text>
  <text x="720" y="472" class="label">provider JSON plan → normalize and enrich</text>
  <path d="M770 410 H980" class="call"/><path d="M990 455 H780" class="return"/>

  <text x="790" y="522" class="label">4  one complete activity.py request</text><path d="M770 532 H980" class="call"/>
  <text x="800" y="558" class="note">Streaming partial text is UI progress only; the final extracted source is authoritative.</text>
  <text x="805" y="590" class="label">candidate source</text><path d="M990 600 H780" class="return"/>

  <text x="790" y="632" class="label">5  deterministic known repairs + verify</text><path d="M770 642 H1195" class="call"/>
  <rect x="1100" y="665" width="210" height="94" rx="12" fill="#fee2e2" stroke="#f87171"/>
  <text x="1120" y="692" class="head">Acceptance gates</text>
  <text x="1120" y="716" class="label">static request checks</text>
  <text x="1120" y="740" class="label">isolated GTK runtime + Journal</text>

  <rect x="680" y="782" width="635" height="112" rx="12" fill="#fdf4ff" stroke="#d946ef"/>
  <text x="700" y="809" class="head">Failure branch — same source lineage</text>
  <text x="700" y="834" class="label">diagnostics → exact SEARCH/REPLACE request → atomic apply</text>
  <text x="700" y="858" class="label">re-run every gate; reject ambiguity, cycles, secrets, or whole-file replacement</text>
  <text x="700" y="882" class="note">Repeat within bounded budget. Best failed draft and audit remain resumable.</text>
  <path d="M1205 770 C1205 780 990 774 990 782" class="return"/>

  <text x="790" y="928" class="label">6  critic, sanitized icon, assemble project</text><path d="M770 938 H1385" class="call"/>
  <text x="575" y="962" class="label">GenerationResult + revision</text><path d="M1395 972 H560" class="return"/>
  <path d="M550 995 H135" class="return"/><text x="160" y="1017" class="note">UI renders preview/review/version/ship state from the persisted successful result.</text>
</svg>
