<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="820" viewBox="0 0 1460 820" role="img" aria-labelledby="title desc">
  <title id="title">Review and Versions data model</title><desc id="desc">Live generation context and accepted project files feed Review, while immutable session revisions feed source and diff views. Failed children do not become active.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.t{font:700 29px Inter,Arial;fill:#0f172a}.s{font:400 14px Inter,Arial;fill:#475569}.h{font:700 16px Inter,Arial;fill:#0f172a}.b{font:400 12.5px Inter,Arial;fill:#334155}.l{font:600 11.5px Inter,Arial;fill:#475569}.e{stroke:#475569;stroke-width:2.1;fill:none;marker-end:url(#a)}.d{stroke:#dc2626;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1460" height="820" rx="24" fill="#f8fafc"/><text x="52" y="53" class="t">Review shows build contents; Versions shows accepted lineage</text><text x="52" y="80" class="s">Draft visibility does not imply acceptance. A revision appears only after the complete generation policy succeeds.</text>
  <g transform="translate(52 125)"><rect width="350" height="230" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="20" y="34" class="h">LIVE JOB CONTEXT</text><text x="20" y="64" class="b">stage · progress · provider · message</text><text x="20" y="87" class="b">prompt · initial/refinement mode</text><text x="20" y="110" class="b">temporary activity.py scaffold</text><text x="20" y="133" class="b">provider draft when available</text><text x="20" y="156" class="b">repair history + diagnostics</text><line x1="20" y1="174" x2="330" y2="174" stroke="#f59e0b"/><text x="20" y="198" class="l">readable during build or failure</text><text x="20" y="218" class="l">never a session revision by itself</text></g>
  <g transform="translate(472 125)"><rect width="350" height="230" rx="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="20" y="34" class="h">ACCEPTED GenerationResult.files</text><text x="20" y="64" class="b">README.md · LICENSE</text><text x="20" y="87" class="b">activity/activity.info + icon</text><text x="20" y="110" class="b">activity.py</text><text x="20" y="133" class="b">aod_plan.json</text><text x="20" y="156" class="b">setup.py</text><line x1="20" y1="174" x2="330" y2="174" stroke="#22c55e"/><text x="20" y="198" class="l">read-only file navigator</text><text x="20" y="218" class="l">source of truth for active Review</text></g>
  <g transform="translate(892 125)"><rect width="516" height="230" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="20" y="34" class="h">REVIEW TAB</text><rect x="20" y="55" width="155" height="145" rx="11" fill="#fff" stroke="#93c5fd"/><text x="38" y="82" class="l">FILE NAVIGATOR</text><text x="38" y="108" class="b">README.md</text><text x="38" y="130" class="b">LICENSE</text><text x="38" y="152" class="b">activity/</text><text x="38" y="174" class="b">activity.py</text><text x="38" y="196" class="b">plan + setup</text><rect x="192" y="55" width="304" height="145" rx="11" fill="#fff" stroke="#93c5fd"/><text x="212" y="82" class="l">TITLE · SUMMARY · META</text><line x1="212" y1="99" x2="476" y2="99" stroke="#cbd5e1"/><text x="212" y="125" class="b">syntax-formatted, selectable content</text><text x="212" y="149" class="b">live draft OR accepted file</text><text x="212" y="178" class="l">Activity Tools can scroll to source line</text></g>
  <path d="M402 240H892M822 240H892" class="e"/>
  <g transform="translate(52 485)"><rect width="770" height="225" rx="17" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="20" y="34" class="h">SESSION REVISION LINEAGE</text><g transform="translate(28 70)"><circle cx="52" cy="52" r="47" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="38" y="48" class="h">v1</text><text x="17" y="72" class="l">initial</text></g><g transform="translate(218 70)"><circle cx="52" cy="52" r="47" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="38" y="48" class="h">v2</text><text x="16" y="72" class="l">refine</text></g><g transform="translate(408 70)"><circle cx="52" cy="52" r="47" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="38" y="48" class="h">v3</text><text x="19" y="72" class="l">active</text></g><g transform="translate(608 70)"><circle cx="52" cy="52" r="47" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><text x="34" y="48" class="h">job</text><text x="17" y="72" class="l">failed</text></g><path d="M127 122H218M317 122H408" class="e"/><path d="M507 122H608" class="d"/><text x="558" y="185" class="l">not appended / v3 remains active</text><text x="20" y="211" class="l">Each revision: stable ID · parent ID · prompt · time · provider/model · project path · result summary</text></g>
  <g transform="translate(892 465)"><rect width="516" height="265" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="20" y="34" class="h">VERSIONS TAB</text><rect x="20" y="55" width="170" height="180" rx="11" fill="#fff" stroke="#93c5fd"/><text x="38" y="82" class="l">HISTORY CARDS</text><text x="38" y="110" class="b">vN + timestamp</text><text x="38" y="133" class="b">provider/model</text><text x="38" y="156" class="b">prompt summary</text><text x="38" y="187" class="l">click → source</text><text x="38" y="213" class="l">no restore action</text><rect x="208" y="55" width="288" height="180" rx="11" fill="#fff" stroke="#93c5fd"/><text x="228" y="82" class="l">SOURCE / DIFF</text><text x="228" y="110" class="b">Before selector → After selector</text><text x="228" y="133" class="b">active source: in-memory result</text><text x="228" y="156" class="b">history: revision project path</text><text x="228" y="179" class="b">line comparison: difflib.ndiff</text><text x="228" y="213" class="l">default: newest parent → newest</text></g>
  <path d="M822 598H892" class="e"/><path d="M647 355V485" class="e"/><text x="658" y="425" class="l">success appends revision</text>
  <rect x="52" y="765" width="1356" height="35" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="72" y="788" class="b">Studio Versions ≠ Git: no checkout, rollback, merge, branch, or deletion. Repository source control remains ordinary Git.</text>
</svg>
