<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100"
     viewBox="0 0 1600 1100" role="img"
     aria-labelledby="title description">
  <title id="title">Right sidebar direction options</title>
  <desc id="description">A decision reference comparing an optional Activity Tools drawer with context-only activity actions.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14"
                    flood-color="#1f1f24" flood-opacity="0.12"/>
    </filter>
    <style>
      .page-title { font: 700 34px sans-serif; fill: #242428; }
      .page-subtitle { font: 400 17px sans-serif; fill: #66666e; }
      .option-title { font: 700 25px sans-serif; fill: #242428; }
      .section-title { font: 700 16px sans-serif; fill: #242428; }
      .body { font: 400 15px sans-serif; fill: #4d4d55; }
      .small { font: 400 13px sans-serif; fill: #6d6d75; }
      .tiny { font: 600 12px sans-serif; fill: #5f5f68; letter-spacing: 0.4px; }
      .button { font: 700 14px sans-serif; fill: #2a2a2f; }
      .white { fill: #ffffff; }
      .purple { fill: #6d52cc; }
      .orange { fill: #ef6a3a; }
      .green { fill: #267a58; }
      .amber { fill: #9b6418; }
      .line { stroke: #d9d9df; stroke-width: 2; }
      .soft-line { stroke: #e9e9ed; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#f6f6f4"/>

  <text x="80" y="72" class="page-title">Right sidebar direction — decision reference</text>
  <text x="80" y="106" class="page-subtitle">The child test showed non-use. The next prototype must test discoverability, comprehension, value, and timing.</text>

  <rect x="80" y="138" width="1440" height="66" rx="18" fill="#ffffff" stroke="#dedee3"/>
  <circle cx="116" cy="171" r="14" fill="#ef6a3a"/>
  <text x="111" y="176" class="white" style="font:700 15px sans-serif">!</text>
  <text x="144" y="166" class="section-title">Shared rule</text>
  <text x="144" y="189" class="body">Play stays primary. Nothing opens automatically. Every change is reviewed, validated, and kept as a new revision.</text>

  <!-- Option C -->
  <rect x="80" y="236" width="700" height="754" rx="26" fill="#ffffff"
        stroke="#d9d9df" filter="url(#shadow)"/>
  <rect x="112" y="268" width="92" height="28" rx="14" fill="#eee9ff"/>
  <text x="132" y="287" class="tiny purple">OPTION C</text>
  <text x="112" y="332" class="option-title">Optional Activity Tools drawer</text>
  <text x="112" y="360" class="body">A deliberate maker space opened by a clearly named toolbar action.</text>

  <!-- Option C mock application -->
  <rect x="112" y="392" width="636" height="344" rx="17" fill="#fafafa" stroke="#cfcfd5"/>
  <rect x="112" y="392" width="636" height="46" rx="17" fill="#29292c"/>
  <rect x="112" y="421" width="636" height="17" fill="#29292c"/>
  <text x="132" y="421" class="white" style="font:700 13px sans-serif">Classroom preview</text>
  <rect x="601" y="401" width="127" height="28" rx="14" fill="#ffffff"/>
  <text x="619" y="420" class="button">Activity Tools</text>

  <rect x="130" y="456" width="377" height="260" rx="13" fill="#ffffff" stroke="#e3e3e7"/>
  <text x="151" y="485" class="section-title">Generated activity</text>
  <rect x="151" y="507" width="335" height="76" rx="12" fill="#edf7f2"/>
  <circle cx="192" cy="545" r="23" fill="#bce6d2"/>
  <path d="M184 545l7 7 13-17" fill="none" stroke="#267a58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="228" y="540" class="section-title">Play continues underneath</text>
  <text x="228" y="562" class="small">Drawer closes without changing the activity.</text>
  <rect x="151" y="603" width="155" height="42" rx="12" fill="#6d52cc"/>
  <text x="181" y="629" class="white" style="font:700 14px sans-serif">Play activity</text>

  <rect x="522" y="438" width="226" height="298" fill="#ffffff" stroke="#cfcfd5"/>
  <text x="542" y="470" class="section-title">Activity Tools</text>
  <text x="711" y="470" class="body">×</text>
  <text x="542" y="499" class="small">What do you want to do?</text>
  <rect x="542" y="521" width="186" height="70" rx="12" fill="#f4f1ff" stroke="#cfc3fb"/>
  <text x="559" y="549" class="button">Change this activity</text>
  <text x="559" y="572" class="small">Difficulty, look, content</text>
  <rect x="542" y="603" width="186" height="70" rx="12" fill="#f7f7f8" stroke="#dedee3"/>
  <text x="559" y="631" class="button">See how it works</text>
  <text x="559" y="654" class="small">Purpose, behavior, code</text>
  <text x="542" y="702" class="tiny green">CLOSED BY DEFAULT</text>

  <text x="112" y="778" class="section-title">Interaction</text>
  <circle cx="126" cy="810" r="14" fill="#6d52cc"/>
  <text x="122" y="815" class="white" style="font:700 13px sans-serif">1</text>
  <text x="151" y="815" class="body">Child chooses Activity Tools</text>
  <line x1="350" y1="810" x2="379" y2="810" stroke="#aaaab2" stroke-width="2"/>
  <path d="M374 804l7 6-7 6" fill="none" stroke="#aaaab2" stroke-width="2"/>
  <circle cx="404" cy="810" r="14" fill="#6d52cc"/>
  <text x="400" y="815" class="white" style="font:700 13px sans-serif">2</text>
  <text x="429" y="815" class="body">Selects an intention</text>
  <line x1="580" y1="810" x2="609" y2="810" stroke="#aaaab2" stroke-width="2"/>
  <path d="M604 804l7 6-7 6" fill="none" stroke="#aaaab2" stroke-width="2"/>
  <circle cx="634" cy="810" r="14" fill="#6d52cc"/>
  <text x="630" y="815" class="white" style="font:700 13px sans-serif">3</text>
  <text x="659" y="815" class="body">Reviews</text>

  <rect x="112" y="850" width="306" height="104" rx="14" fill="#edf7f2"/>
  <text x="130" y="878" class="tiny green">AVAILABLE FOUNDATION</text>
  <text x="130" y="903" class="body">Overlay drawer · refinement · preview</text>
  <text x="130" y="925" class="body">targeting · source overview · versions</text>
  <rect x="430" y="850" width="318" height="104" rx="14" fill="#fff5e7"/>
  <text x="448" y="878" class="tiny amber">NEEDS PRODUCT WORK</text>
  <text x="448" y="903" class="body">Rename “Sidebar” · capability-aware</text>
  <text x="448" y="925" class="body">presets · child-language testing</text>

  <!-- Option D -->
  <rect x="820" y="236" width="700" height="754" rx="26" fill="#ffffff"
        stroke="#d9d9df" filter="url(#shadow)"/>
  <rect x="852" y="268" width="92" height="28" rx="14" fill="#ffece6"/>
  <text x="872" y="287" class="tiny orange">OPTION D</text>
  <text x="852" y="332" class="option-title">Context-only entry points</text>
  <text x="852" y="360" class="body">No permanent tools control; an action appears only when the moment gives it meaning.</text>

  <!-- Option D mock application -->
  <rect x="852" y="392" width="636" height="344" rx="17" fill="#fafafa" stroke="#cfcfd5"/>
  <rect x="852" y="392" width="636" height="46" rx="17" fill="#29292c"/>
  <rect x="852" y="421" width="636" height="17" fill="#29292c"/>
  <text x="872" y="421" class="white" style="font:700 13px sans-serif">Classroom preview</text>
  <text x="1364" y="421" class="white" style="font:400 13px sans-serif">No tools button</text>

  <rect x="870" y="456" width="600" height="260" rx="13" fill="#ffffff" stroke="#e3e3e7"/>
  <text x="891" y="485" class="section-title">Generated activity</text>
  <rect x="907" y="518" width="176" height="76" rx="12" fill="#edf7f2" stroke="#b5dcc8"/>
  <text x="936" y="550" class="section-title">Selected object</text>
  <text x="948" y="572" class="small">Answer button</text>
  <rect x="1098" y="528" width="128" height="38" rx="19" fill="#6d52cc"/>
  <text x="1120" y="552" class="white" style="font:700 14px sans-serif">Change this</text>
  <path d="M1084 549h14" stroke="#6d52cc" stroke-width="3"/>

  <rect x="907" y="620" width="527" height="67" rx="13" fill="#fff0ec" stroke="#f1b9a7"/>
  <circle cx="939" cy="653" r="16" fill="#ef6a3a"/>
  <text x="934" y="659" class="white" style="font:700 16px sans-serif">!</text>
  <text x="967" y="649" class="section-title">This activity could not start</text>
  <text x="967" y="671" class="small">The accepted version is safe.</text>
  <rect x="1318" y="635" width="96" height="36" rx="18" fill="#ef6a3a"/>
  <text x="1347" y="658" class="white" style="font:700 14px sans-serif">Fix</text>

  <text x="852" y="778" class="section-title">Context triggers</text>
  <rect x="852" y="798" width="194" height="52" rx="12" fill="#f4f1ff"/>
  <text x="872" y="820" class="button">Selection</text>
  <text x="872" y="839" class="small">Change this</text>
  <rect x="1056" y="798" width="194" height="52" rx="12" fill="#fff0ec"/>
  <text x="1076" y="820" class="button">Failure</text>
  <text x="1076" y="839" class="small">Fix activity</text>
  <rect x="1260" y="798" width="228" height="52" rx="12" fill="#fff5e7"/>
  <text x="1280" y="820" class="button">Completion</text>
  <text x="1280" y="839" class="small">Future event contract</text>

  <rect x="852" y="870" width="306" height="84" rx="14" fill="#edf7f2"/>
  <text x="870" y="898" class="tiny green">AVAILABLE FOUNDATION</text>
  <text x="870" y="923" class="body">Failure recovery · preview selection</text>
  <text x="870" y="945" class="body">· preserved accepted revision</text>
  <rect x="1170" y="870" width="318" height="84" rx="14" fill="#fff5e7"/>
  <text x="1188" y="898" class="tiny amber">NEEDS NEW CONTRACTS</text>
  <text x="1188" y="923" class="body">Reliable triggers · inline hints · universal</text>
  <text x="1188" y="945" class="body">completion · consistent early access</text>

  <!-- Bottom decision strip -->
  <rect x="80" y="1022" width="1440" height="48" rx="16" fill="#29292c"/>
  <text x="109" y="1052" class="white" style="font:700 15px sans-serif">Decision test:</text>
  <text x="225" y="1052" class="white" style="font:400 15px sans-serif">Does a child intentionally open Activity Tools, or use a contextual action more naturally when a real need appears?</text>
</svg>
